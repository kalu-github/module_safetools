apply plugin: 'com.android.application'

android {

    namespace "com.kalu.opensslkit"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.kalu.opensslkit"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        //添加此行
        flavorDimensions "default"
    }

    buildTypes {
        release {
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // opensslKit
//    implementation project(':lib-openssl-kit')
    implementation(files("libs/lib_opensslkit_release_20250623.aar"))

    // 模块依赖
//    implementation project(':lib_safetools_jni')
//    implementation project(':lib_safetools_java')

    implementation('androidx.appcompat:appcompat:1.7.1')
}